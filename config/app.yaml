# ─────────────────────────────────────────────────────────────
# 应用配置
# ─────────────────────────────────────────────────────────────

app:
  # 名字直说品类：「AI 驱动的 Excel 批量处理工具」。
  # 不用抽象的品牌名当产品名 —— 用户搜的是「怎么批量合并 excel」，
  # 不是品牌词。品牌（DeskKit）放在标题里，品类词放在副标题和 topics 里。
  name: DeskKit Excel
  version: 0.1.5
  # 打包后的 bundle identifier，Windows 上用作 AppUserModelID
  identifier: com.klphp.deskkit

  # 禁止多开（单实例锁）。默认 true —— 只有显式写 false 才允许多开。
  #
  # 为什么默认开：
  #   · 多开几乎都是意外：双击两次图标、从终端和 Finder 各启动一次
  #   · 本模板内嵌了本地 HTTP 服务，两个实例各占一个端口，
  #     外部程序连哪一个都不对，而且这种情况很难排查
  #
  # 第二实例的行为：自行退出，并把主窗口拉到前面（已开着则 Focus + Restore）。
  #
  # 关掉它的代价：内嵌服务必须用系统分配端口（server.addr 的端口写 0），
  # 否则第二个实例会监听失败。没用内嵌服务的应用没有这个限制。
  #
  # 调试期小坑：wails3 dev 起的实例和装好的正式版共用同一个锁标识，
  # 会互相抢。用 APP_INSTANCE_ID 环境变量临时换一个，或 wails3 dev -tags dev。
  singleInstance: true

# 内嵌本地服务
#
# 为什么 Wails 应用还要跑一个 HTTP 服务：
#
#   · bindings 只能 Go ↔ 前端直连，**外部程序调不到**（命令行工具、
#     浏览器书签、别的进程想触发本应用的操作就得走 HTTP）
#   · 前端做流式响应（SSE）、文件下载、大响应体，走 HTTP 更顺
#   · 想让应用同时是个「本地 API 服务器」时，配置一行就能开
#
# 默认只监听 127.0.0.1 —— 不要改成 0.0.0.0，那等于把本地能力
# 暴露到局域网，任何同网段设备都能调。
server:
  enabled: true
  addr: 127.0.0.1:0        # 端口 0 = 系统分配空闲端口。
  # 两个理由：避免和别的程序冲突；以及万一关掉了 app.singleInstance，
  # 多开的实例也不会因为抢同一个端口而启动失败。
  # 确实需要固定端口（比如给外部程序写死了地址）时，请保持 app.singleInstance: true。
  # 需要固定端口时写 127.0.0.1:17890
  enableCORS: false        # 只有需要浏览器跨域访问时才开
  logLevel: info

# ─────────────────────────────────────────────────────────────
# 自更新
#
# 基于 Wails v3 内置的 app.Updater，不是自己写的下载器。
# 默认关闭：enabled 为 false 时整个机制不启用，模板保持干净。
#
# 试水阶段（当前推荐）：
#   enabled: true
#   provider: github
#   repository: 你的用户名/仓库名
#   publicKey: 留空（不验签，零成本）
#
# 资产命名会被 DefaultAssetMatcher 按子串匹配，必须同时含
#   平台：darwin / windows / linux
#   架构：amd64 / arm64（别名 x86_64 / aarch64 / x64 也认）
# 例如 myapp-0.1.1-windows-amd64.zip。写成 myapp-win-x64.exe 匹配不上，
# 会报 "has no asset for darwin/arm64"。
# ─────────────────────────────────────────────────────────────
update:
  # 打开：应用会按 checkInterval 查 GitHub Releases，并在「关于」里显示检查结果。
  # 只有发布出比当前版本更高的 tag，才会提示更新。
  enabled: true
  provider: github
  repository: "klphp/deskkit-excel"
  manifestUrl: ""            # provider: endpoint 时用
  # 必须与 CI 汇总出来的校验和文件名一致（.github/workflows/release.yml）
  checksumAsset: "SHA256SUMS"
  prerelease: false
  publicKey: ""              # 留空 = 不验签
  checkInterval: 6h

# ─────────────────────────────────────────────────────────────
# 多语言
#
# 默认关闭。关着的时候前端只读 zh-CN 的文案，和没有 i18n 完全一样。
# 要用就 enabled: true，并确保 frontend/src/i18n/locales/ 下有对应文件。
# 语言切换入口出现在设置窗口，只列出 locales 里的语言。
# ─────────────────────────────────────────────────────────────
i18n:
  # 设置页出现语言切换的条件是「locales 里配了两种以上语言」。
  # 第一版只发布英文形态：这里只留 en-US，切换器因此不出现。
  # 以后要放开中文，把 zh-CN 一行加回来即可，词条文件已在 i18n/locales/ 里。
  enabled: true
  defaultLocale: en-US
  fallbackLocale: en-US
  locales:
    - en-US

# 官方/第三方 API 对接
apis:
  # 示例：一个典型的外部 API
  example:
    baseURL: https://api.example.com
    timeout: 30s
    # 密钥从环境变量读，不要写在这里 —— 配置文件会进 git
    apiKeyEnv: EXAMPLE_API_KEY
    retry:
      maxAttempts: 3
      backoff: 500ms

# ─────────────────────────────────────────────────────────────
# AI 接入
#
# 全部走 OpenAI 兼容形态：只要对方实现 /chat/completions + Bearer 鉴权
# 就能接（OpenAI、DeepSeek、通义、Kimi、Groq、ollama、LM Studio…）。
# 不为每家写适配器 —— 那等于给它们的字段差异做长期维护。
#
# 密钥不进这个文件：它会被打包进二进制、也会进 git。两种来源：
#   · 环境变量（apiKeyEnv 指定的那个）
#   · 用户在设置里填的，存用户目录 ai.json（0600）
# 优先级：用户设置 > 环境变量 > 配置文件。
#
# 不配这一段时 ai.enabled 自动为 false，AI 入口在前端隐藏。
# ─────────────────────────────────────────────────────────────
ai:
  # 默认打开：这个产品的核心就是「用人话下指令」，AI 面板不该一进来就是死的。
  # 打开不等于必须填密钥 —— 面板会先探测本机 Ollama / LM Studio，
  # 探不到再让用户填 Key。批处理功能本身不依赖 AI，关掉也能用。
  enabled: true

  # 默认服务商（下面 providers 里的 key）
  default: deepseek

  providers:
    # 预设只是「省得你手填地址」。真正的接入顺序和 opencode / Hermes 一样：
    # 先填 key 接上（接入），再点「刷新模型」把对方 /v1/models 拉回来选。
    # 所以下面 model 只是占位默认值，用户在界面上选什么就以什么为准。

    deepseek:
      kind: openai
      label: DeepSeek
      baseURL: https://api.deepseek.com/v1
      # 候选模型：选中服务商就能从下拉里选，不必先有 key 去拉 /v1/models。
      # 点「刷新可用模型」会用真实 key 去拉，覆盖这份清单。
      models:
        - deepseek-chat
        - deepseek-reasoner
      model: deepseek-chat
      apiKeyEnv: DEEPSEEK_API_KEY
      timeout: 60s
      retry:
        maxAttempts: 3
        backoff: 800ms

    # 聚合网关：一个 key 打到很多家模型
    openrouter:
      kind: openai
      label: OpenRouter
      baseURL: https://openrouter.ai/api/v1
      model: anthropic/claude-sonnet-4.5
      apiKeyEnv: OPENROUTER_API_KEY
      timeout: 90s

    # opencode 的 OpenAI 兼容入口
    opencode:
      kind: openai
      label: opencode
      baseURL: https://opencode.ai/zen/go/v1
      models:
        - deepseek-v4.1-flash
      model: deepseek-v4.1-flash
      apiKeyEnv: OPENCODE_API_KEY
      timeout: 90s
      # 这个网关要求带会话标识，否则直接拒绝（提示 cannot be routed）。
      # ${session} 由客户端每次启动生成一个，不写死。
      headers:
        x-opencode-session: ${session}

    # Gemini 的 OpenAI 兼容端点（不是原生 generateContent）
    gemini:
      kind: openai
      label: Google Gemini
      baseURL: https://generativelanguage.googleapis.com/v1beta/openai
      models:
        - gemini-2.5-pro
        - gemini-2.5-flash
      model: gemini-2.5-flash
      apiKeyEnv: GEMINI_API_KEY
      timeout: 60s

    # 本地：数据不出机器，是「隐私」卖点的技术前提。不需要 key。
    ollama:
      kind: ollama
      label: Ollama
      baseURL: http://127.0.0.1:11434
      model: qwen2.5:7b
      timeout: 120s        # 本地小模型首字延迟高，超时给宽一点

    # LM Studio / llama.cpp server：同样 OpenAI 兼容，跑在本机
    lmstudio:
      kind: openai
      label: LM Studio
      baseURL: http://127.0.0.1:1234/v1
      model: local-model
      timeout: 120s

    # 需要一个额外请求头的服务商都能这么配，不用改代码
    # somegateway:
    #   kind: openai
    #   baseURL: https://gw.example.com/v1
    #   model: gpt-4o-mini
    #   apiKeyEnv: GW_KEY
    #   headers:
    #     X-Tenant: my-tenant

  # 本地模型探测：打开设置页时并发 GET 这些地址的模型索引，
  # 不加载模型、不触发推理，400ms 超时。失败静默。
  local:
    enabled: true
    endpoints:
      - http://127.0.0.1:11434   # Ollama
      - http://127.0.0.1:1234    # LM Studio
      - http://127.0.0.1:8080    # llama.cpp server / 其它
    probeTimeout: 400ms

# ─────────────────────────────────────────────────────────────
# 能力包开关
#
# 第一版只放表格处理进来：一个功能做扎实，比三个功能都半成品强。
# 文件操作（fs_*）的代码已经写好了，把 id 加进下面的列表、重新编译
# 就能出现在「功能选择」里 —— 不做代码改动。
#
# 已经实现但第一版不开放的：files（遍历 / 创建 / 移动 / 复制 / 删除）
# ─────────────────────────────────────────────────────────────
tools:
  packs:
    - excel
