# ─────────────────────────────────────────────────────────────
# 窗口定义
# ─────────────────────────────────────────────────────────────
# 这里加一段就能多一个窗口，不用改 Go 代码：
#
#   Go 侧：  windowManager.Open("settings")
#   前端：   await WindowService.Open("settings")
#
# 每个窗口都是同一个 SPA，靠 url 里的查询参数决定渲染什么页面，
# 所以新增窗口 = 加配置 + 前端加一个视图分支。
# ─────────────────────────────────────────────────────────────

windows:
  # 主窗口：应用启动时自动打开
  main:
    title: DeskKit Excel
    width: 1400
    height: 900
    minWidth: 900
    minHeight: 600
    url: /
    frameless: true        # macOS 走系统红绿灯，Windows 走自绘控件
    main: true             # 标记为主窗口（关闭即退出）

    # 标题栏元素显隐。两个都缺省 true。
    #
    # 注意即使 showTitle: false，标题栏本身也还在 —— frameless 下它是唯一
    # 的拖动入口和窗口按钮载体，整条去掉窗口就没法拖、没法关了。
    showTitle: true
    showSettingsButton: true

  # 设置窗口：示例，用来演示「配置即可用」
  # 设置 / 关于不再开子窗口 —— 它们在主窗口里是 Vue 浮层。
  #
  # 为什么改：每个 Wails 窗口是独立 WebView、独立 JS 运行时。在设置窗口里
  # 切语言，主窗口的 i18n 状态根本不知道（主题那边靠 localStorage 的
  # storage 事件跨窗口同步过，语言没做，就露馅了：只有设置窗口变了）。
  # 改成浮层后同一个运行时、同一份状态，切换立刻处处生效，
  # 也省掉窗口定位与内容自适应那一整套。

