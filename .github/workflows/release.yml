name: Release

# 推一个 v* 标签就出全套产物 + GitHub Release。
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# 也可以手动跑（workflow_dispatch）：只出产物不建 Release，用来验证 workflow 本身。
#
# 产物命名必须让 Wails 的 DefaultAssetMatcher 认出来：文件名小写后要同时包含
# 平台名（darwin/windows/linux）和架构名（amd64/arm64），否则自更新会报
# "has no asset for darwin/arm64"。这是硬前提，别改成 win-x64 这种写法。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 是主力目标
          - os: windows-latest
            platform: windows
            arch: amd64
            ext: .exe
          # macOS 用一台 Intel runner 同时出 Intel 与 Apple Silicon 两个包。
          # 原因：arm64 专用 runner 排队动辄几小时（实测三次都没跑出来），
          # 而 clang 交叉编 arm64 我们在本机验证过可行（cgo + SQLCipher 都过）。
          - os: macos-15
            platform: darwin
            arch: both
            ext: ""

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 会话库用 SQLCipher，必须 CGO。runner 上的 MSYS2 基础包里没有 gcc，
      # 得用这个动作装上（比手写 pacman 稳）。
      - name: Setup C toolchain (Windows)
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Put gcc on PATH (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # runner 上的 MSYS2 在 C:\tools\msys64（不是 C:\msys64），而且路径随镜像版本变，
          # 所以不写死：先试已知位置，再退化成按名字找。
          $known = @("C:\tools\msys64\ucrt64\bin", "C:\msys64\ucrt64\bin")
          $mingw = $known | Where-Object { Test-Path (Join-Path $_ "gcc.exe") } | Select-Object -First 1
          if (-not $mingw) {
            $found = Get-ChildItem -Path C:\ -Filter gcc.exe -Recurse -Depth 5 -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -match "ucrt64|mingw64" } | Select-Object -First 1
            if ($found) { $mingw = $found.DirectoryName }
          }
          if (-not $mingw) { throw "gcc not found (tried: $($known -join ', '))" }
          Write-Output "gcc dir = $mingw"
          "$mingw" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC=gcc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & (Join-Path $mingw "gcc.exe") --version | Select-Object -First 1

      # 直接 go build 不会嵌 Windows 资源：图标和 DPI manifest 全靠 .syso。
      # 不走 wails3 build 就得自己生成，否则 exe 在资源管理器里是个空白图标。
      # 早期闸门：tag 与 config 里的版本必须一致。
      # 客户端比较的是编译进二进制的 app.version，不是 tag；两者不一致时用户
      # 永远收不到更新，而且没有任何报错——只能靠这道检查发现。
      - name: Check tag matches config version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          CFG=$(grep -E "^  version:" config/app.yaml | head -1 | awk '{print $2}' | tr -d '"')
          TAG="${GITHUB_REF_NAME#v}"
          echo "config version = $CFG, tag = $TAG"
          if [ "$CFG" != "$TAG" ]; then
            echo "tag/config version mismatch: clients compare the version in config ($CFG) and will never see $TAG"
            exit 1
          fi

      - name: Embed Windows icon + manifest
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          go install github.com/akavel/rsrc@latest
          "$(go env GOPATH)/bin/rsrc" -arch amd64 \
            -ico build/windows/icon.ico \
            -manifest build/windows/wails.exe.manifest \
            -o rsrc_windows_amd64.syso
          ls -l rsrc_windows_amd64.syso

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p bin
          ./scripts/check-frontend-guards.sh
          cd frontend && npm ci && npm run build && cd ..
          # 与本地一致的参数：production 标签 + 去符号；Windows 必须 windowsgui，
          # 否则双击会附带一个黑色命令行窗口。
          LDFLAGS="-w -s"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            LDFLAGS="-w -s -H windowsgui"
          fi
          if [ "${{ matrix.arch }}" = "both" ]; then
            # 同一台 Intel runner 上交叉编两个架构，产物名字带架构，后面按名字打包。
            # 注意：clang 的架构名与 Go 不同 —— Go 的 amd64 在 clang 里叫 x86_64，
            # 直接传 -arch amd64 会报 "invalid arch name '-arch amd64'"（踩过）。
            for a in amd64 arm64; do
              case "$a" in
                amd64) CLANG_ARCH="x86_64" ;;
                arm64) CLANG_ARCH="arm64" ;;
              esac
              echo "=== build darwin/$a (clang -arch $CLANG_ARCH) ==="
              CGO_ENABLED=1 GOARCH=$a CC=clang \
                CGO_CFLAGS="-arch $CLANG_ARCH" CGO_LDFLAGS="-arch $CLANG_ARCH" \
                go build -tags production -trimpath -ldflags "$LDFLAGS" -o "bin/deskkit-$a" .
            done
          else
            go build -tags production -trimpath -ldflags "$LDFLAGS" -o "bin/deskkit${{ matrix.ext }}" .
          fi
          ls -lh bin/

      # 硬验证，不靠"应该没问题"：Windows 产物的 PE 子系统必须是 2（GUI）。
      # 3 表示控制台程序，双击会多一个黑框，用户会当成 bug 报上来。
      # 硬闸门：内嵌 exe 的 manifest 必须合法。
      # 事故：manifest 里 version="0.1.0"（三段），Windows 要求四段，激活上下文
      # 生成失败 → 用户双击毫无反应，连报错都没有。编译/测试/CI 全都不报。
      - name: Verify Windows manifest in exe
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $exe = "bin/deskkit.exe"
          $bytes = [IO.File]::ReadAllBytes($exe)
          $text = [Text.Encoding]::UTF8.GetString($bytes)
          if ($text -notmatch 'version="\d+\.\d+\.\d+\.\d+"') {
            throw "no four-part assemblyIdentity version found inside the exe - manifest missing, or version is malformed (three-part makes the app silently refuse to start)"
          }
          if ($text -match 'assemblyIdentity[^>]*version="0\.1\.0"') {
            throw "the manifest inside the exe still uses a three-part version; Windows will refuse to load it"
          }
          Write-Output "manifest version is four-part: ok"

      - name: Verify Windows subsystem
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $fs = [System.IO.File]::OpenRead("bin/deskkit.exe")
          $br = New-Object System.IO.BinaryReader($fs)
          $fs.Position = 0x3C
          $peOff = $br.ReadInt32()
          $fs.Position = $peOff + 0x5C
          $sub = $br.ReadUInt16()
          $br.Close(); $fs.Close()
          Write-Output "PE subsystem = $sub (2 = GUI)"
          if ($sub -ne 2) { throw "artifact is a console program (subsystem=$sub); double-clicking would open an extra console window" }

          # 图标检查：没有资源段时 ExtractAssociatedIcon 拿不到图标
          Add-Type -AssemblyName System.Drawing
          $ico = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path "bin/deskkit.exe").Path)
          if (-not $ico -or $ico.Width -lt 16) { throw "no icon resource inside the exe (rsrc did not apply)" }
          Write-Output ("icon = " + $ico.Width + "x" + $ico.Height)

      # 未签名 + arm64 的 macOS 上，二进制至少要有一个 ad-hoc 签名才能运行。
      # 注意：**不要**在这里运行 bin/deskkit —— 它是 GUI 程序，会一直挂着不退出，
      # 上一版就是因为写了 `./bin/deskkit --version` 把 macOS job 挂死了 40 多分钟。
      - name: Ad-hoc sign (macOS)
        if: matrix.platform == 'darwin'
        shell: bash
        timeout-minutes: 10
        run: |
          for a in amd64 arm64; do
            # lipo 也按 Apple 的命名：Intel 是 x86_64，不是 Go 的 amd64
            case "$a" in
              amd64) LIPO_ARCH="x86_64" ;;
              arm64) LIPO_ARCH="arm64" ;;
            esac
            chmod +x "bin/deskkit-$a"
            codesign --force --sign - "bin/deskkit-$a"
            file "bin/deskkit-$a"
            lipo -archs "bin/deskkit-$a"
            # 架构自检：编错架构的包用户装了跑不起来
            lipo -archs "bin/deskkit-$a" | grep -q "$LIPO_ARCH" || { echo "wrong architecture: expected $LIPO_ARCH (Go arch $a)"; exit 1; }
          done

      # macOS 用户拿裸二进制也能跑，但 .app 更像正常软件：双击即用、有图标。
      # 这里手工拼一个最小 bundle，避免依赖 wails3 package 的平台限制。
      - name: Bundle .app (macOS)
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          for a in amd64 arm64; do
            APP="DeskKit-$a.app"
            rm -rf "bin/$APP"
            mkdir -p "bin/$APP/Contents/MacOS" "bin/$APP/Contents/Resources"
            cp "bin/deskkit-$a" "bin/$APP/Contents/MacOS/DeskKit Excel"
            cp build/darwin/icons.icns "bin/$APP/Contents/Resources/iconfile.icns" 2>/dev/null || true
            cat > "bin/$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>DeskKit Excel</string>
            <key>CFBundleDisplayName</key><string>DeskKit Excel</string>
            <key>CFBundleIdentifier</key><string>com.klphp.deskkit</string>
            <key>CFBundleExecutable</key><string>DeskKit Excel</string>
            <key>CFBundleIconFile</key><string>iconfile</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
            sed -i '' "s/\${VERSION}/${GITHUB_REF_NAME#v}/" "bin/$APP/Contents/Info.plist" 2>/dev/null || \
              sed -i "s/\${VERSION}/${GITHUB_REF_NAME#v}/" "bin/$APP/Contents/Info.plist"
            codesign --force --deep --sign - "bin/$APP"
            file "bin/$APP/Contents/MacOS/DeskKit Excel"
          done
        env:
          VERSION: ${{ github.ref_name }}

      # ── 打包 ──
      # 每个平台的产物形状不同，而且不能共用一个 shell 脚本：
      # Windows runner 上没有 zip 命令（那是 Linux/macOS 的东西），必须用 Compress-Archive。
      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # 手动触发时 GITHUB_REF_NAME 是分支名（main），不能当版本号用
          $ref = "$env:GITHUB_REF_NAME"
          if ($ref -match '^v\d') { $version = $ref -replace '^v','' } else { $version = "0.0.0-dev" }
          $name = "deskkit-$version-windows-$env:ARCH"
          # zip 里只能有可执行文件本身。
          # Wails 更新器在解压后要求「只有一个顶层条目」，并把它直接顶替运行中的
          # exe；多放一个 README 就会得到
          #   updater: archive must contain exactly one top-level entry, got 4
          # 用户点更新什么都不发生 —— 实测踩过。README/免责声明在仓库里，校验和是
          # 独立资产（SHA256SUMS），不需要塞进包里。
          $stage = "dist/pkg-$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item bin/deskkit.exe -Destination $stage
          $entries = @(Get-ChildItem $stage).Count
          if ($entries -ne 1) { throw "windows package must hold exactly one file, found $entries" }
          Compress-Archive -Path "$stage/deskkit.exe" -DestinationPath "$name.zip" -CompressionLevel Optimal
          Write-Output ("package = " + $name + ".zip " + (Get-Item "$name.zip").Length + " bytes")

      - name: Package (macOS)
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # 同上：只有 v 开头的 tag 才当版本号，手动触发用占位版本
          if [[ "$GITHUB_REF_NAME" == v[0-9]* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-dev"; fi
          cd bin
          for a in amd64 arm64; do
            # macOS 只发 DMG，不发 zip。
            # 原因：Mac 上的更新是「给用户一个 dmg 链接，他自己拖进应用程序」，
            # 那条路不需要 zip；而 zip 是自更新器专用的格式，Mac 上没人用它，
            # 混在资产里只会让下载页多两个没人该点的文件。
            # （Wails 更新器的资产匹配只看文件名里的平台+架构，dmg 同样能被认出来，
            #   所以「检查更新」照常工作。）

            # 同时出一个 DMG：给人手动下载用（拖进"应用程序"）。
            # 两个都要的原因：Wails 自更新只认 zip（updater/extract.go 没有 dmg 分支），
            # 而 DMG 是 Mac 用户习惯的安装方式。zip 给更新器，dmg 给首次下载。
            # 在临时目录里建镜像并用绝对路径输出。
            # 踩过：用相对路径 + 仓库目录当 srcfolder，CI 上 hdiutil 报
            # "create failed - Resource busy"（临时 RW 镜像和源目录在同一卷上打架）。
            # 再加几次重试 —— 这个错误本身也常是瞬时的。
            STAGE=$(mktemp -d)/stage
            mkdir -p "$STAGE"
            cp -R "DeskKit-$a.app" "$STAGE/"
            ln -sf /Applications "$STAGE/Applications"
            OUTDMG="$PWD/../deskkit-${VERSION}-darwin-${a}.dmg"
            ok=0
            for attempt in 1 2 3; do
              if hdiutil create -volname "DeskKit Excel" -srcfolder "$STAGE" \
                   -ov -nospotlight -format UDZO "$OUTDMG" >/dev/null 2>&1; then
                ok=1; break
              fi
              echo "hdiutil attempt $attempt failed; retrying"
              sleep 5
            done
            rm -rf "$(dirname "$STAGE")"
            if [ "$ok" -ne 1 ]; then echo "could not build $OUTDMG"; exit 1; fi
          done
          cd ..
          # macOS 只出 dmg（zip 已经不再构建），列一下确认产物在
          ls -lh deskkit-*-darwin-*.dmg

      - name: Checksums
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          shopt -s nullglob
          files=(deskkit-*.zip deskkit-*.tar.gz deskkit-*.dmg)
          if command -v sha256sum >/dev/null; then
            sha256sum "${files[@]}" > "SHA256SUMS-${PLATFORM}-${ARCH}.txt"
          else
            shasum -a 256 "${files[@]}" > "SHA256SUMS-${PLATFORM}-${ARCH}.txt"
          fi
          cat "SHA256SUMS-${PLATFORM}-${ARCH}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            deskkit-*.zip
            deskkit-*.tar.gz
            deskkit-*.dmg
            SHA256SUMS-*.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    # 只要有一个平台构建成功就出 Release：Windows 是主力目标，
    # 不能让一个较慢/失败的 macOS job 把整次发版卡死。没有产物则不发空 Release。
    if: always() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Ensure there is something to release
        run: |
          shopt -s nullglob
          files=(dist/deskkit-*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no build artifacts found; skipping the release"
            exit 1
          fi

      # 汇总成单个 SHA256SUMS：配置里的 ChecksumAsset 指向它
      - name: Merge checksums
        run: |
          cd dist
          cat SHA256SUMS-*.txt > SHA256SUMS 2>/dev/null || true
          rm -f SHA256SUMS-*.txt
          cat SHA256SUMS 2>/dev/null || true

      # 发布说明一律英文，并且不用「自动从提交生成」——本仓库的提交信息是中文，
      # 自动生成会得到一份中文说明，与仓库对外语言不一致。
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: DeskKit Excel ${{ github.ref_name }}
          body_path: .github/release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # 发版后复核：机器判定这版能不能被客户端发现并安装，不靠人点。
  verify:
    needs: release
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Verify published release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/verify-release.sh
          ./scripts/verify-release.sh "${GITHUB_REF_NAME}"
