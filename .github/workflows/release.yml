name: Release

# 推一个 v* 标签就出全套产物 + GitHub Release。
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# 也可以手动跑（workflow_dispatch）：只出产物不建 Release，用来验证 workflow 本身。
#
# 产物命名必须让 Wails 的 DefaultAssetMatcher 认出来：文件名小写后要同时包含
# 平台名（darwin/windows/linux）和架构名（amd64/arm64），否则自更新会报
# "has no asset for darwin/arm64"。这是硬前提，别改成 win-x64 这种写法。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 是主力目标
          - os: windows-latest
            platform: windows
            arch: amd64
            ext: .exe
          # Mac 分两种芯片：Intel 用 Intel runner，M 系列用 arm64 runner。
          # 都是 CGO（SQLCipher），所以不能靠交叉编译糊弄，各上各的机器。
          - os: macos-15
            platform: darwin
            arch: amd64
            ext: ""
          - os: macos-15-arm64
            platform: darwin
            arch: arm64
            ext: ""
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 会话库用 SQLCipher，必须 CGO。runner 上的 MSYS2 基础包里没有 gcc，
      # 得用这个动作装上（比手写 pacman 稳）。
      - name: Setup C toolchain (Windows)
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Put gcc on PATH (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $mingw = "C:\msys64\ucrt64\bin"
          if (-not (Test-Path "$mingw\gcc.exe")) { Get-ChildItem C:\msys64 -Directory | Select-Object Name }
          if (-not (Test-Path "$mingw\gcc.exe")) { throw "找不到 gcc：$mingw" }
          "$mingw" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "CC=gcc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & "$mingw\gcc.exe" --version | Select-Object -First 1

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.arch }}
        run: |
          cd frontend && npm ci && npm run build && cd ..
          # 与本地一致的参数：production 标签 + 去符号；Windows 必须 windowsgui，
          # 否则双击会附带一个黑色命令行窗口。
          LDFLAGS="-w -s"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            LDFLAGS="-w -s -H windowsgui"
          fi
          go build -tags production -trimpath -ldflags "$LDFLAGS" -o "bin/deskkit${{ matrix.ext }}" .
          ls -lh bin/

      # 硬验证，不靠"应该没问题"：Windows 产物的 PE 子系统必须是 2（GUI）。
      # 3 表示控制台程序，双击会多一个黑框，用户会当成 bug 报上来。
      - name: Verify Windows subsystem
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $fs = [System.IO.File]::OpenRead("bin/deskkit.exe")
          $br = New-Object System.IO.BinaryReader($fs)
          $fs.Position = 0x3C
          $peOff = $br.ReadInt32()
          $fs.Position = $peOff + 0x5C
          $sub = $br.ReadUInt16()
          $br.Close(); $fs.Close()
          Write-Output "PE subsystem = $sub (2 = GUI)"
          if ($sub -ne 2) { throw "产物是控制台程序（subsystem=$sub），双击会多一个命令行窗口" }

      # 未签名 + arm64 的 macOS 上，二进制至少要有一个 ad-hoc 签名才能运行
      - name: Ad-hoc sign (macOS)
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          chmod +x bin/deskkit
          codesign --force --sign - bin/deskkit
          codesign -dv bin/deskkit 2>&1 | head -3
          ./bin/deskkit --version 2>/dev/null || echo "（GUI 程序，跳过运行验证）"

      # macOS 用户拿裸二进制也能跑，但 .app 更像正常软件：双击即用、有图标。
      # 这里手工拼一个最小 bundle，避免依赖 wails3 package 的平台限制。
      - name: Bundle .app (macOS)
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          APP="DeskKit Excel.app"
          rm -rf "bin/$APP"
          mkdir -p "bin/$APP/Contents/MacOS" "bin/$APP/Contents/Resources"
          cp bin/deskkit "bin/$APP/Contents/MacOS/DeskKit Excel"
          cp build/darwin/icons.icns "bin/$APP/Contents/Resources/iconfile.icns" 2>/dev/null || true
          cat > "bin/$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>DeskKit Excel</string>
            <key>CFBundleDisplayName</key><string>DeskKit Excel</string>
            <key>CFBundleIdentifier</key><string>com.klphp.deskkit</string>
            <key>CFBundleExecutable</key><string>DeskKit Excel</string>
            <key>CFBundleIconFile</key><string>iconfile</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          sed -i '' "s/\${VERSION}/${GITHUB_REF_NAME#v}/" "bin/$APP/Contents/Info.plist" 2>/dev/null || \
            sed -i "s/\${VERSION}/${GITHUB_REF_NAME#v}/" "bin/$APP/Contents/Info.plist"
          codesign --force --deep --sign - "bin/$APP"
        env:
          VERSION: ${{ github.ref_name }}

      # ── 打包 ──
      - name: Package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="0.0.0-dev"
          OUT="deskkit-${VERSION}-${PLATFORM}-${ARCH}"
          case "$PLATFORM" in
            windows)
              # 便携版：解压即用，附带说明与免责声明
              STAGE="dist/$OUT"
              mkdir -p "$STAGE"
              cp bin/deskkit.exe README.md DISCLAIMER.md "$STAGE/"
              (cd "$STAGE" && sha256sum deskkit.exe > SHA256SUMS.txt)
              (cd dist && zip -qr "../$OUT.zip" "$OUT")
              ;;
            darwin)
              # .app 必须整目录压缩，Wails 自更新只认 zip
              cd bin
              zip -qry "../$OUT.zip" "DeskKit Excel.app"
              cd ..
              ;;
            linux)
              tar -czf "$OUT.tar.gz" -C bin deskkit
              ;;
          esac
          ls -lh "$OUT".* 2>/dev/null || ls -lh $OUT.zip

      - name: Checksums
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          shopt -s nullglob
          files=(deskkit-*.zip deskkit-*.tar.gz)
          if command -v sha256sum >/dev/null; then
            sha256sum "${files[@]}" > "SHA256SUMS-${PLATFORM}-${ARCH}.txt"
          else
            shasum -a 256 "${files[@]}" > "SHA256SUMS-${PLATFORM}-${ARCH}.txt"
          fi
          cat "SHA256SUMS-${PLATFORM}-${ARCH}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            deskkit-*.zip
            deskkit-*.tar.gz
            SHA256SUMS-*.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      # 汇总成单个 SHA256SUMS：配置里的 ChecksumAsset 指向它
      - name: Merge checksums
        run: |
          cd dist
          cat SHA256SUMS-*.txt > SHA256SUMS 2>/dev/null || true
          rm -f SHA256SUMS-*.txt
          cat SHA256SUMS 2>/dev/null || true

      # 发布说明一律英文，并且不用「自动从提交生成」——本仓库的提交信息是中文，
      # 自动生成会得到一份中文说明，与仓库对外语言不一致。
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: DeskKit Excel ${{ github.ref_name }}
          body_path: .github/release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
